services:
  - type: web
    name: tvk-tracker-backend
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # Filled in via Render dashboard after first deploy:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: APIFY_API_TOKEN
        sync: false
      - key: ADMIN_SECRET
        sync: false
      # Public config
      - key: GOVT_START_DATE
        value: "2026-05-11"
      - key: GOVT_NAME
        value: TVK
      - key: ALLOWED_ORIGINS
        value: "http://localhost:3000,https://tvk-files.vercel.app"
      - key: PYTHON_VERSION
        value: "3.11.8"
