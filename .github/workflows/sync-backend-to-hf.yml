name: Sync backend/ to HF Space

# Auto-pushes the backend/ subtree to the goknaga/tvk-tracker-backend HF
# Space whenever main moves. Without this, GitHub and HF drift apart
# silently — the HF Space was found 13 commits behind during the
# cron-migration deploy, which is exactly the failure mode this fixes.
#
# Trigger: any push to main that touches backend/ files. (We don't run
# on frontend-only or scripts-only pushes — those don't affect HF.)
#
# Secret required: HF_TOKEN with write access to the Space. Get it from
# https://huggingface.co/settings/tokens (create a "Write" token), then
# add it under Settings → Secrets and variables → Actions as HF_TOKEN.
# The HUGGINGFACE_API_KEY secret that already exists for other workflows
# may be read-only; create a separate write-scoped token if so.

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      # Also fire when this workflow itself changes
      - '.github/workflows/sync-backend-to-hf.yml'
  workflow_dispatch:

concurrency:
  group: hf-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repo (full history for subtree)
        uses: actions/checkout@v4
        with:
          # subtree push needs the complete commit graph for backend/
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions (HF sync)"

      - name: Install huggingface_hub
        run: pip install --upgrade "huggingface_hub>=0.25"

      - name: Upload backend/ to HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -e
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::HF_TOKEN secret is not set. Add a write-scoped token from huggingface.co/settings/tokens under repo Settings → Secrets and variables → Actions."
            exit 1
          fi

          # Use huggingface_hub.upload_folder instead of `git subtree push`.
          # The subtree approach was fragile: `git subtree split -b <branch>`
          # failed fast on re-runs and silently left HF up to 3 commits
          # behind (root cause of the 2026-05-29 propaganda-router 404).
          # upload_folder diffs the backend/ tree against the Space repo and
          # commits only what changed — idempotent, no local branch state,
          # no force-push gymnastics.
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          commit = api.upload_folder(
              repo_id="goknaga/tvk-tracker-backend",
              repo_type="space",
              folder_path="backend",
              path_in_repo=".",
              commit_message="CI sync from GitHub main",
              # Don't wipe Space-only files (README with HF metadata header,
              # .gitattributes). delete_patterns left unset = additive sync.
              ignore_patterns=["**/__pycache__/**", "**/*.pyc", ".env", ".venv/**"],
          )
          print(f"Synced backend/ -> HF Space. Commit: {getattr(commit, 'oid', commit)}")
          PY

          echo "::notice::Successfully synced backend/ to HF Space via huggingface_hub"
