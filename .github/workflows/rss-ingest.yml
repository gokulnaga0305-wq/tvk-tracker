name: Press / RSS ingestion (every 30 min — full loop)

# Runs the FULL RSS source loop to completion on a real GitHub Actions
# runner, instead of HF's FastAPI BackgroundTask which gets killed
# partway through (only 2-3 of ~17 sources finished per run, starving
# Sun News / News18 for days). A real job completes every source.
#
# Cost: $0 — GitHub Actions is free for public repos (this repo is public),
# RSS fetches are free, AI runs on the free chain (Groq -> OpenRouter free
# models -> Gemini free).
#
# NOTE: once this is green for a day, DISABLE the cron-job.org
# "scrape-press-rss" job so the same sources aren't ingested twice (which
# would double free-tier AI spend). This GH Actions job replaces it.

on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 minutes
  workflow_dispatch:
    inputs:
      per_source:
        description: 'Max items per source'
        required: false
        default: '25'

concurrency:
  group: rss-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend deps
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run RSS ingest (full loop)
        working-directory: backend     # so app.config finds .env-style settings
        env:
          PYTHONUNBUFFERED: '1'        # stream logs live (don't block-buffer)
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_VISION_API_KEY: ${{ secrets.GOOGLE_VISION_API_KEY }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
        run: |
          set -e
          # Smaller per-source (10, not 25) so the full ~17-source loop
          # finishes inside the 20-min timeout even when free-tier AI is
          # rate-limiting. The cheap gate filters most items cheaply; the
          # rotation logic + every-30-min cadence covers everything over time.
          PER="${{ github.event.inputs.per_source || '10' }}"
          python ../scripts/ingest_rss.py --per-source "${PER}"
