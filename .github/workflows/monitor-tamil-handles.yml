name: Tamil press + govt-handle monitor (every 6 hours — free-tier safe)

# Periodically pulls the last few hours of tweets from:
#   - 5 independent Tamil press handles (SparkPluz_, PttvNewsX, youturn_in,
#     News18TamilNadu, sunnewstamil)
#   - 2 govt-official handles (CMOTamilnadu, TNDIPRNEWS) which feed the
#     Promise Comparator
#   - 1 independent commentary/data account (dstock_insights — TN sectoral
#     growth data + satire; tier=social_media so single posts hold in
#     pending_verification until press corroborates)
# Each tweet is AI-extracted -> incident -> district-tagged -> meter updates.
#
# Cadence: every 2 hours so the dashboard never goes more than ~2h stale on
# breaking news (e.g. a fresh Neelankarai power-cut protest hits the
# dashboard within ~120 min of Tamil press tweeting about it).
#
# Cost: Apify scrape ~$0.00025/tweet × ~200 tweets/run × 12 runs/day =
# ~$0.60/day = ~$18/month.
#
# Concurrency guard prevents two runs piling up if a run takes long.

on:
  # Re-enabled as the RELIABLE owner of the Twitter-handle lane. cron-job.org
  # was NOT firing /api/cron/monitor-handles (last Apify run was 5+ days stale),
  # so the Tamil-TV handles went dark while the free RSS path kept the rest
  # fresh. GH Actions runs this self-contained on free infra — no dependency
  # on cron-job.org or HF being awake.
  #
  # Cadence: every 6 hours (4 runs/day). Apify FREE tier is $5/month platform
  # credit; at ~50 tweets/handle x 5 handles x 4 runs/day x $0.00025 ≈ $4.5/mo,
  # which stays UNDER the free budget. Running every 2h (the old cadence) would
  # cost ~$22/mo and exhaust Apify in ~1 week — which is what kept happening.
  # The Google-News RSS path (every 30 min, free) covers breaking news between
  # these runs, so 6h on the handles is plenty.
  schedule:
    - cron: '15 */6 * * *'   # 00:15, 06:15, 12:15, 18:15 UTC
  workflow_dispatch:
    inputs:
      hours:
        description: 'Lookback window in hours (default 7)'
        required: false
        default: '7'

concurrency:
  group: tamil-monitor
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend deps
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run monitor
        working-directory: backend     # ensures .env-style settings resolution
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          GOOGLE_FACT_CHECK_API_KEY: ${{ secrets.GOOGLE_FACT_CHECK_API_KEY }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
        run: |
          set -e
          HOURS="${{ github.event.inputs.hours || '7' }}"
          echo "::notice::Monitoring Tamil press + govt handles, lookback=${HOURS}h"
          python ../scripts/monitor_tvk_handles.py --hours "${HOURS}" 2>&1 | tee /tmp/monitor.log

          # Surface the tweet count in the GH Actions summary
          queued=$(grep -E "^Done. Total tweets queued:" /tmp/monitor.log | awk '{print $NF}')
          if [ -n "$queued" ]; then
            echo "::notice::Queued ${queued} tweets through the AI pipeline this run"
          fi
