name: Tweet watch

# Polls public Nitter RSS for watched DMK-defense / fact-check handles
# (@saysatheesh et al.), dedups, and queues credit-steal / fact candidates into
# the tweet_watch review table. NOT an auto-publisher — promotion to an incident
# is a separate human-verified step. Free (no Apify, no AI key).

on:
  schedule:
    - cron: '40 1,9,15 * * *'   # 3x/day: 01:40, 09:40, 15:40 UTC
  workflow_dispatch:
    inputs:
      handles:
        description: 'Comma-separated handles override (blank = default watchlist)'
        required: false
        default: ''

concurrency:
  group: tweet-watch
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend deps
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run tweet-watch poll
        working-directory: backend
        env:
          PYTHONUNBUFFERED: '1'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -e
          HANDLES="${{ github.event.inputs.handles }}"
          if [ -n "$HANDLES" ]; then
            python ../scripts/scrape_tweet_watch.py --handles "$HANDLES"
          else
            python ../scripts/scrape_tweet_watch.py
          fi
